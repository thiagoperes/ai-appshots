name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  smoke:
    # Installs the packed tarball the way a consumer would, then drives a real
    # capture of a throwaway page end to end. Catches anything `typecheck`
    # cannot: a missing entry in `files`, a broken bin shim, a config that no
    # longer loads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci
      - run: npm pack --pack-destination /tmp

      - name: Set up a consumer project
        run: |
          mkdir -p /tmp/smoke/site
          cd /tmp/smoke
          npm init -y > /dev/null
          npm install /tmp/storeshot-*.tgz
          cat > site/index.html <<'HTML'
          <!doctype html>
          <title>smoke</title>
          <body style="margin:0;background:#111;color:#fff;font:600 32px sans-serif">
            <div data-ready style="padding:64px">Hello</div>
          </body>
          HTML
          cat > storeshot.config.ts <<'TS'
          import { defineConfig } from 'storeshot';

          export default defineConfig({
            baseUrl: 'http://127.0.0.1:8123',
            screens: [
              { id: 'home', path: '/', theme: 'dark', waitFor: ['[data-ready]'] },
            ],
            captions: { en: { home: { kicker: 'Smoke', title: 'It renders' } } },
          });
          TS

      # Playwright is an optional peer dependency, so capturing from a browser
      # means bringing both the package and the binaries, as the README says.
      - name: Install Playwright
        working-directory: /tmp/smoke
        run: |
          npm install --save-dev playwright
          npx playwright install --with-deps chromium webkit

      - name: Capture and compose
        working-directory: /tmp/smoke
        run: |
          python3 -m http.server 8123 --directory site &
          npx wait-on http://127.0.0.1:8123
          npx storeshot

      - name: Check every target produced an asset
        working-directory: /tmp/smoke
        run: |
          for target in ios-iphone-6.9 ios-ipad-13 android-phone android-tablet; do
            test -f "screenshots/framed/en/$target/01-home.png"
          done

      # The import driver takes full device screens, as a simulator or XCUITest
      # produces, so it gets a stand-in of exactly that size rather than the
      # status-bar-less page crops the web driver leaves in screenshots/raw.
      - name: Frame a full-screen image through the import driver
        working-directory: /tmp/smoke
        run: |
          mkdir -p incoming/ios-iphone-6.9
          node -e "
            require('sharp')({
              create: {
                width: 1320,
                height: 2868,
                channels: 3,
                background: '#101828',
              },
            })
              .png()
              .toFile('incoming/ios-iphone-6.9/home.png');
          "
          cat > import.config.ts <<'TS'
          import { defineConfig, DEFAULT_TARGETS, findTarget } from 'storeshot';

          export default defineConfig({
            outDir: 'imported',
            targets: [findTarget('ios-iphone-6.9', DEFAULT_TARGETS)],
            capture: { kind: 'import', dir: 'incoming' },
            screens: [{ id: 'home', theme: 'dark' }],
            captions: { en: { home: { title: 'Imported' } } },
          });
          TS
          npx storeshot --config import.config.ts
          test -f imported/framed/en/ios-iphone-6.9/01-home.png

      - name: Refuse a capture that is the wrong shape
        working-directory: /tmp/smoke
        run: |
          cp screenshots/raw/en/ios-iphone-6.9/home.png incoming/ios-iphone-6.9/
          if npx storeshot --config import.config.ts 2>err.log; then
            echo 'expected the page crop to be rejected'
            exit 1
          fi
          grep -q 'short by exactly' err.log

      - uses: actions/upload-artifact@v5
        with:
          name: smoke-assets
          path: /tmp/smoke/screenshots/framed

  smoke-ios:
    # Real capture from the iOS Simulator. Safari stands in for an app under
    # test, which is enough to exercise device creation, booting, the marketing
    # status bar override, deep-link navigation and `simctl io screenshot`.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci
      - run: npm pack --pack-destination /tmp

      - name: Set up a consumer project
        run: |
          mkdir -p /tmp/native/site
          cd /tmp/native
          npm init -y > /dev/null
          npm install /tmp/storeshot-*.tgz
          cat > site/index.html <<'HTML'
          <!doctype html>
          <title>native smoke</title>
          <body style="margin:0;background:#0b1020;color:#fff;font:600 34px -apple-system,sans-serif">
            <div style="padding:120px 48px">Captured from a real iOS Simulator</div>
          </body>
          HTML
          cat > storeshot.config.ts <<'TS'
          import { defineConfig, DEFAULT_TARGETS, findTarget } from 'storeshot';

          export default defineConfig({
            baseUrl: 'http://127.0.0.1:8123',
            targets: [findTarget('ios-iphone-6.9', DEFAULT_TARGETS)],
            settleDelay: 4000,
            capture: {
              kind: 'ios-simulator',
              device: ['iPhone 17 Pro Max', 'iPhone 16 Pro Max', 'iPhone 15 Pro Max'],
              bundleId: 'com.apple.mobilesafari',
            },
            screens: [
              { id: 'home', deepLink: 'http://127.0.0.1:8123/', theme: 'dark' },
            ],
            captions: { en: { home: { title: 'Straight off the simulator' } } },
          });
          TS

      - name: Capture and compose
        working-directory: /tmp/native
        run: |
          python3 -m http.server 8123 --directory site &
          npx wait-on http://127.0.0.1:8123
          npx storeshot

      - name: Check the asset exists and is full-screen
        working-directory: /tmp/native
        run: |
          test -f screenshots/framed/en/ios-iphone-6.9/01-home.png
          node -e "
            const { readFileSync } = require('node:fs');
            const png = readFileSync('screenshots/raw/en/ios-iphone-6.9/home.png');
            const width = png.readUInt32BE(16);
            const height = png.readUInt32BE(20);
            console.log('raw capture ' + width + 'x' + height);
            if (height < width * 1.9) {
              throw new Error('expected a full device screen, not a page crop');
            }
          "

      - uses: actions/upload-artifact@v5
        with:
          name: smoke-ios-assets
          path: /tmp/native/screenshots/framed

  smoke-no-browser:
    # Proves a native or imported run needs no browser at all: Playwright is
    # skipped at install time, so neither the package nor any browser binary is
    # present, and composition still has to produce a store-ready asset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci
      - run: npm pack --pack-destination /tmp

      - name: Install without Playwright
        run: |
          mkdir -p /tmp/headless/incoming/ios-iphone-6.9
          cd /tmp/headless
          npm init -y > /dev/null
          # Playwright is an optional peer dependency, so a plain install brings
          # neither the package nor any browser binary.
          npm install /tmp/storeshot-*.tgz
          test ! -d node_modules/playwright
          cat > storeshot.config.ts <<'TS'
          import { defineConfig, DEFAULT_TARGETS, findTarget } from 'storeshot';

          export default defineConfig({
            targets: [findTarget('ios-iphone-6.9', DEFAULT_TARGETS)],
            capture: { kind: 'import', dir: 'incoming' },
            screens: [{ id: 'home', theme: 'dark' }],
            captions: {
              en: { home: { kicker: 'No browser', title: 'Composed by sharp alone' } },
            },
          });
          TS

      - name: Compose from an imported screen
        working-directory: /tmp/headless
        run: |
          node -e "
            require('sharp')({
              create: { width: 1320, height: 2868, channels: 3, background: '#101828' },
            })
              .png()
              .toFile('incoming/ios-iphone-6.9/home.png');
          "
          npx storeshot
          node -e "
            const { readFileSync } = require('node:fs');
            const png = readFileSync(
              'screenshots/framed/en/ios-iphone-6.9/01-home.png',
            );
            const width = png.readUInt32BE(16);
            const height = png.readUInt32BE(20);
            if (width !== 1320 || height !== 2868) {
              throw new Error('unexpected size ' + width + 'x' + height);
            }
          "

      - name: Explain the missing browser when a web capture is asked for
        working-directory: /tmp/headless
        run: |
          cat > web.config.ts <<'TS'
          import { defineConfig, DEFAULT_TARGETS, findTarget } from 'storeshot';

          export default defineConfig({
            baseUrl: 'http://127.0.0.1:8123',
            targets: [findTarget('ios-iphone-6.9', DEFAULT_TARGETS)],
            screens: [{ id: 'home', path: '/', theme: 'dark' }],
            captions: { en: { home: { title: 'Needs a browser' } } },
          });
          TS
          if npx storeshot --config web.config.ts 2>err.log; then
            echo 'expected the web capture to fail without Playwright'
            exit 1
          fi
          grep -q 'needs Playwright' err.log

      - uses: actions/upload-artifact@v5
        with:
          name: smoke-no-browser-assets
          path: /tmp/headless/screenshots/framed
